<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow-cyan" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-indigo" cx="75%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .font-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Dot Matrix Overlay -->
  <rect width="1200" height="480" rx="16" fill="url(#grid-dots)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="180" r="300" fill="url(#glow-cyan)"/>
  <circle cx="900" cy="300" r="320" fill="url(#glow-indigo)"/>

  <!-- Top Pill / Status Tag -->
  <g transform="translate(450, 48)">
    <rect width="300" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="5" fill="#10b981"/>
    <text x="36" y="23" fill="#cbd5e1" class="font-badge" letter-spacing="0.5">OPEN-SOURCE CAREER INTELLIGENCE</text>
  </g>

  <!-- Hero Logo Icon & Title -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Main Headline -->
    <text y="0" fill="url(#title-grad)" class="font-title" font-size="54" letter-spacing="-1.5">
      CareerHub
    </text>
    
    <!-- Subtitle / Mission Statement -->
    <text y="48" fill="#94a3b8" class="font-sub" font-size="20" letter-spacing="0.2">
      Autonomous AI Career Suite &amp; Safe LinkedIn Networking Platform
    </text>

    <!-- Value Bullet Highlights -->
    <text y="88" fill="#64748b" class="font-sub" font-size="15" letter-spacing="0.5">
      Single-Page ATS Vector Resumes  •  Zero-Scraping LinkedIn Strategy  •  BYOK AI Cost Governance
    </text>
  </g>

  <!-- Feature Cards Deck -->
  <g transform="translate(100, 310)">
    <!-- Card 1: Resume Tailor -->
    <g transform="translate(0, 0)">
      <rect width="220" height="110" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <circle cx="34" cy="34" r="14" fill="#0284c7" fill-opacity="0.2"/>
      <text x="34" y="39" text-anchor="middle" font-size="16">📄</text>
      <text x="58" y="38" fill="#f8fafc" class="font-badge" font-size="15">ATS Tailor Studio</text>
      <text x="20" y="72" fill="#94a3b8" class="font-sub" font-size="12">Guaranteed 1-Page Vector PDF</text>
      <text x="20" y="90" fill="#64748b" class="font-sub" font-size="11">Real-time keyword matching</text>
    </g>

    <!-- Card 2: Job Discovery -->
    <g transform="translate(260, 0)">
      <rect width="220" height="110" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <circle cx="34" cy="34" r="14" fill="#6366f1" fill-opacity="0.2"/>
      <text x="34" y="39" text-anchor="middle" font-size="16">💼</text>
      <text x="58" y="38" fill="#f8fafc" class="font-badge" font-size="15">Job Discovery</text>
      <text x="20" y="72" fill="#94a3b8" class="font-sub" font-size="12">Greenhouse, Lever &amp; Ashby</text>
      <text x="20" y="90" fill="#64748b" class="font-sub" font-size="11">1-Click Hand-off to Tailor</text>
    </g>

    <!-- Card 3: Safe LinkedIn -->
    <g transform="translate(520, 0)">
      <rect width="220" height="110" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <circle cx="34" cy="34" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="34" y="39" text-anchor="middle" font-size="16">🛡️</text>
      <text x="58" y="38" fill="#f8fafc" class="font-badge" font-size="15">Safe Networking</text>
      <text x="20" y="72" fill="#94a3b8" class="font-sub" font-size="12">Circuit-Breaker Rate Pacing</text>
      <text x="20" y="90" fill="#64748b" class="font-sub" font-size="11">Zero account ban risk</text>
    </g>

    <!-- Card 4: AI Gateway -->
    <g transform="translate(780, 0)">
      <rect width="220" height="110" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <circle cx="34" cy="34" r="14" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="34" y="39" text-anchor="middle" font-size="16">⚡</text>
      <text x="58" y="38" fill="#f8fafc" class="font-badge" font-size="15">AI Cost Gateway</text>
      <text x="20" y="72" fill="#94a3b8" class="font-sub" font-size="12">BYOK &amp; Exact Token Budgets</text>
      <text x="20" y="90" fill="#64748b" class="font-sub" font-size="11">Zero cost for routine tasks</text>
    </g>
  </g>
</svg>
